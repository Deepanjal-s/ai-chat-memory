<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conversation Memory – settings</title>
    <style>
      body { font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #161a21; }
      h1 { font-size: 18px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9ced6; border-radius: 8px; font: inherit; }
      button { margin-top: 16px; margin-right: 8px; padding: 8px 14px; border-radius: 8px; border: 0; background: #1f4fd1; color: #fff; font: inherit; cursor: pointer; }
      button.secondary { background: #eef1f6; color: #161a21; }
      .msg { margin-top: 14px; padding: 8px 10px; border-radius: 8px; }
      .ok { background: #e6f4ec; color: #18794e; }
      .bad { background: #fdeceb; color: #c0282d; }
      p.note { color: #5a6270; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Conversation Memory capture</h1>
    <p class="note">
      This extension reads the ChatGPT conversation on your screen after each reply and sends it to your Conversation Memory app. It does not read
      passwords or cookies. In the app, open <b>Settings → Connected browsers</b> to create a pairing token.
    </p>
    <label for="server">App address</label>
    <input id="server" placeholder="http://localhost:3000" />
    <label for="token">Pairing token</label>
    <input id="token" type="password" placeholder="aim_…" autocomplete="off" />
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
    <div id="msg"></div>
    <script src="options.js"></script>
  </body>
</html>
