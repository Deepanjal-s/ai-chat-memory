<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; width: 280px; margin: 0; padding: 14px; color: #161a21; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .state { padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; }
      .ok { background: #e6f4ec; color: #18794e; }
      .bad { background: #fdeceb; color: #c0282d; }
      .muted { color: #5a6270; }
      button { margin-top: 8px; width: 100%; padding: 7px; border-radius: 6px; border: 0; background: #1f4fd1; color: #fff; font: inherit; cursor: pointer; }
      a { color: #1f4fd1; }
    </style>
  </head>
  <body>
    <h1>Conversation Memory</h1>
    <div id="state" class="state"></div>
    <div id="details" class="muted"></div>
    <button id="now">Save this conversation now</button>
    <p class="muted"><a href="#" id="opts">Settings</a></p>
    <script src="popup.js"></script>
  </body>
</html>
